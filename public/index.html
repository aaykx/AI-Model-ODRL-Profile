<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIMD v2 — Compliance Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ── Tokens ─────────────────────────────────────────────────────────── */
:root {
  --ink:      #0f0f0f;
  --ground:   #f7f7f5;
  --surface:  #ffffff;
  --muted:    #767676;
  --rule:     #d8d8d6;
  --faint:    #ebebea;
  --green:    #16a34a;
  --green-bg: #f0fdf4;
  --red:      #dc2626;
  --red-bg:   #fef2f2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink:      #f0f0ee;
    --ground:   #111110;
    --surface:  #1a1a18;
    --muted:    #888885;
    --rule:     #2e2e2c;
    --faint:    #222220;
    --green:    #4ade80;
    --green-bg: #052e16;
    --red:      #f87171;
    --red-bg:   #450a0a;
  }
}
:root[data-theme="light"] {
  --ink:#0f0f0f;--ground:#f7f7f5;--surface:#ffffff;--muted:#767676;
  --rule:#d8d8d6;--faint:#ebebea;--green:#16a34a;--green-bg:#f0fdf4;
  --red:#dc2626;--red-bg:#fef2f2;
}
:root[data-theme="dark"] {
  --ink:#f0f0ee;--ground:#111110;--surface:#1a1a18;--muted:#888885;
  --rule:#2e2e2c;--faint:#222220;--green:#4ade80;--green-bg:#052e16;
  --red:#f87171;--red-bg:#450a0a;
}

/* ── Reset ──────────────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:15px;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--ground);color:var(--ink);
  line-height:1.6;-webkit-font-smoothing:antialiased;
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.001ms!important;transition-duration:0.001ms!important;}
}

/* ── Header ─────────────────────────────────────────────────────────── */
header{background:var(--ink);color:var(--ground);padding:2.5rem 2.5rem 2rem;}
.header-inner{max-width:1300px;margin:0 auto;}
.eyebrow{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;opacity:.45;margin-bottom:.6rem;}
header h1{font-size:clamp(1.5rem,3vw,2.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:.4rem;}
header h1 span{font-weight:300;opacity:.5;}
.subtitle{font-size:.8rem;font-weight:300;opacity:.55;margin-bottom:1.75rem;}
.header-controls{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
#runBtn{
  font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;
  background:var(--ground);color:var(--ink);
  border:none;padding:.65rem 1.5rem;cursor:pointer;transition:opacity .15s;
}
#runBtn:hover{opacity:.75;}
#runBtn:disabled{opacity:.3;cursor:not-allowed;}
#statusPill{
  font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.05em;
  padding:.3rem .7rem;border:1px solid rgba(247,247,245,.18);color:rgba(247,247,245,.55);
}
#summary{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.03em;color:rgba(247,247,245,.45);}

/* ── Tab bar ─────────────────────────────────────────────────────────── */
.tab-bar{background:var(--ink);padding:0 2.5rem;border-top:1px solid rgba(247,247,245,.08);}
.tab-bar-inner{max-width:1300px;margin:0 auto;display:flex;}
.tab-btn{
  font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:none;color:rgba(247,247,245,.4);
  padding:.85rem 1.2rem .85rem 0;cursor:pointer;transition:color .12s;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab-btn:hover{color:rgba(247,247,245,.75);}
.tab-btn.active{color:var(--ground);border-bottom-color:var(--ground);}

/* ── Main ────────────────────────────────────────────────────────────── */
main{max-width:1300px;margin:0 auto;padding:2rem 2.5rem 4rem;}

/* ── Spinner ─────────────────────────────────────────────────────────── */
#progress{display:none;align-items:center;gap:.6rem;padding:1.5rem 0;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);}
#progress.visible{display:flex;}
.spinner{width:13px;height:13px;border:2px solid var(--rule);border-top-color:var(--ink);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ── Error banner ────────────────────────────────────────────────────── */
#errorBanner{display:none;background:var(--red);color:#fff;padding:.9rem 1.1rem;font-family:'JetBrains Mono',monospace;font-size:.72rem;margin-bottom:1.5rem;}
#errorBanner.visible{display:block;}

/* ── Tab panels ──────────────────────────────────────────────────────── */
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* ════════════════════════════════════════════════════════════════════
   TAB 1 — Use Cases
   ════════════════════════════════════════════════════════════════════ */
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:1px;background:var(--rule);}
#grid:empty{background:transparent;}

.card{
  background:var(--surface);padding:1.75rem;display:flex;flex-direction:column;
  cursor:pointer;transition:transform .12s,box-shadow .12s;
  opacity:0;transform:translateY(8px);
  animation:fadeUp .3s ease forwards;
  border-left:3px solid transparent;
}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,0,0,.08);}
@keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
.card.compliant{border-left-color:var(--green);}
.card.violation{border-left-color:var(--red);}

.uc-num{
  font-family:'JetBrains Mono',monospace;font-size:3rem;font-weight:700;
  letter-spacing:-.04em;line-height:1;margin-bottom:1.1rem;color:var(--ink);opacity:.1;
}
.card-title{font-size:.9rem;font-weight:600;letter-spacing:-.01em;margin-bottom:.25rem;}
.card-chain{font-size:.75rem;font-weight:300;font-style:italic;color:var(--muted);margin-bottom:1.1rem;line-height:1.4;}
.card-verdict{
  font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:.13em;
  text-transform:uppercase;font-weight:700;margin-bottom:.55rem;
  display:flex;align-items:center;gap:.45rem;
}
.card-verdict::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.card.compliant .card-verdict{color:var(--green);}
.card.compliant .card-verdict::before{background:var(--green);}
.card.violation .card-verdict{color:var(--red);}
.card.violation .card-verdict::before{background:var(--red);}

.card-detail{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);line-height:1.55;flex:1;margin-bottom:.9rem;}
.card-legal{font-size:.67rem;font-weight:300;line-height:1.4;padding-top:.9rem;border-top:1px solid var(--rule);color:var(--muted);}
.card-click-hint{font-size:.62rem;color:var(--muted);opacity:.5;margin-top:.6rem;text-align:right;letter-spacing:.04em;}

/* placeholder */
.ph-card{background:var(--surface);padding:1.75rem;}
.ph-line{height:9px;background:var(--faint);border-radius:2px;margin-bottom:.5rem;}
.ph-line.w20{width:20%;}.ph-line.w40{width:40%;}.ph-line.w60{width:60%;}.ph-line.w80{width:80%;}

/* ════════════════════════════════════════════════════════════════════
   MODAL
   ════════════════════════════════════════════════════════════════════ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:1.5rem;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all;}

.modal{
  background:var(--surface);width:100%;max-width:640px;max-height:90vh;
  overflow-y:auto;position:relative;
  transform:scale(.96) translateY(8px);transition:transform .2s;
}
.modal-overlay.open .modal{transform:scale(1) translateY(0);}

.modal-close{
  position:absolute;top:1.25rem;right:1.25rem;
  background:none;border:none;cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:.8rem;
  color:var(--muted);padding:.25rem .5rem;transition:color .12s;
  z-index:1;
}
.modal-close:hover{color:var(--ink);}

/* modal top strip — colored bar */
.modal-strip{height:4px;width:100%;}
.modal-strip.compliant{background:var(--green);}
.modal-strip.violation{background:var(--red);}

.modal-body{padding:2rem;}

.modal-meta{display:flex;align-items:flex-start;gap:1.25rem;margin-bottom:1.5rem;}
.modal-uc-num{
  font-family:'JetBrains Mono',monospace;font-size:3.5rem;font-weight:700;
  letter-spacing:-.04em;line-height:1;color:var(--ink);opacity:.1;flex-shrink:0;
}
.modal-meta-right{flex:1;}
.modal-badge{
  display:inline-flex;align-items:center;gap:.4rem;
  font-family:'JetBrains Mono',monospace;font-size:.65rem;
  letter-spacing:.13em;text-transform:uppercase;font-weight:700;
  margin-bottom:.4rem;
}
.modal-badge::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;}
.modal-badge.compliant{color:var(--green);}
.modal-badge.compliant::before{background:var(--green);}
.modal-badge.violation{color:var(--red);}
.modal-badge.violation::before{background:var(--red);}

.modal-title{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin-bottom:.2rem;}
.modal-chain{font-size:.78rem;font-weight:300;font-style:italic;color:var(--muted);}

.modal-section{margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:1px solid var(--rule);}
.modal-section:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none;}
.modal-section-label{
  font-size:.65rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:.5rem;
}
.modal-section-body{font-size:.82rem;line-height:1.6;color:var(--ink);}
.modal-finding{
  font-family:'JetBrains Mono',monospace;font-size:.75rem;line-height:1.55;
  padding:.75rem 1rem;margin-top:.5rem;
  border-left:3px solid;background:var(--faint);
}
.modal-finding.compliant{border-color:var(--green);}
.modal-finding.violation{border-color:var(--red);}
.modal-legal{font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--muted);line-height:1.55;}

/* ════════════════════════════════════════════════════════════════════
   TAB 2 — Compliance Checks
   ════════════════════════════════════════════════════════════════════ */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(540px,1fr));gap:1px;background:var(--rule);}
.comp-panel{background:var(--surface);padding:2rem;}
.comp-dist-id{font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.04em;color:var(--muted);margin-bottom:.4rem;}
.comp-overall{font-size:1rem;font-weight:700;letter-spacing:-.01em;margin-bottom:.2rem;}
.comp-overall.pass{color:var(--green);}
.comp-overall.fail{color:var(--red);}
.comp-summary{font-size:.75rem;color:var(--muted);font-family:'JetBrains Mono',monospace;}

.acc-section{border-top:1px solid var(--rule);margin-top:1.25rem;}
.acc-trigger{width:100%;text-align:left;background:none;border:none;padding:.75rem 0;cursor:pointer;display:flex;align-items:center;justify-content:space-between;color:var(--ink);}
.acc-label{font-size:.7rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.acc-arrow{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);transition:transform .15s;}
.acc-trigger[aria-expanded="true"] .acc-arrow{transform:rotate(180deg);}
.acc-body{display:none;padding-bottom:.75rem;}
.acc-trigger[aria-expanded="true"]+.acc-body{display:block;}

.ob-row{display:flex;gap:.6rem;padding:.45rem 0;border-bottom:1px solid var(--faint);}
.ob-row:last-child{border-bottom:none;}
.ob-icon{font-family:'JetBrains Mono',monospace;font-size:.72rem;flex-shrink:0;min-width:1.4rem;padding-top:.1rem;}
.ob-icon.pass{color:var(--green);}
.ob-icon.fail{color:var(--red);}
.ob-icon.warn{color:#d97706;}
.ob-content{flex:1;min-width:0;}
.ob-label{font-size:.78rem;line-height:1.4;}
.ob-desc{font-size:.7rem;color:var(--muted);line-height:1.4;margin-top:.1rem;}
.ob-legal{font-size:.67rem;color:var(--muted);font-style:italic;}
.ob-value{font-family:'JetBrains Mono',monospace;font-size:.67rem;color:var(--muted);word-break:break-all;margin-top:.15rem;}

.sub-row{display:flex;gap:.5rem;padding:.35rem 0;border-bottom:1px solid var(--faint);font-size:.74rem;}
.sub-row:last-child{border-bottom:none;}
.sub-icon{font-family:'JetBrains Mono',monospace;font-size:.67rem;flex-shrink:0;min-width:1.4rem;padding-top:.1rem;}
.sub-icon.pass{color:var(--green);}
.sub-icon.fail{color:var(--red);}
.sub-icon.warn{color:#d97706;}
.sub-label{flex:1;line-height:1.4;}
.sub-value{font-family:'JetBrains Mono',monospace;font-size:.67rem;color:var(--muted);max-width:38%;text-align:right;word-break:break-all;}

.xr-row{display:flex;gap:.5rem;padding:.35rem 0;border-bottom:1px solid var(--faint);font-size:.75rem;}
.xr-row:last-child{border-bottom:none;}
.xr-key{color:var(--muted);min-width:9rem;flex-shrink:0;font-size:.72rem;}
.xr-val{font-family:'JetBrains Mono',monospace;font-size:.68rem;word-break:break-all;flex:1;}
.xr-result{font-size:.75rem;font-weight:600;padding-top:.5rem;}
.xr-result.pass{color:var(--green);}
.xr-result.fail{color:var(--red);}

.no-data{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);padding:1.5rem 0;}

/* ════════════════════════════════════════════════════════════════════
   TAB 3 — Provenance Chain
   ════════════════════════════════════════════════════════════════════ */
.chain-title{font-size:1.1rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.3rem;}
.chain-start{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);word-break:break-all;margin-bottom:1.75rem;}
.hop-item{display:flex;gap:1.5rem;padding:1.5rem;background:var(--surface);margin-bottom:1px;border-left:3px solid var(--rule);opacity:0;transform:translateX(-6px);animation:slideIn .3s ease forwards;}
@keyframes slideIn{to{opacity:1;transform:translateX(0);}}
.hop-item.hop-pass{border-left-color:var(--green);}
.hop-item.hop-fail{border-left-color:var(--red);}
.hop-num{font-family:'JetBrains Mono',monospace;font-size:2rem;font-weight:700;letter-spacing:-.04em;color:var(--ink);opacity:.12;flex-shrink:0;line-height:1;min-width:2.5rem;}
.hop-body{flex:1;}
.hop-dist-id{font-family:'JetBrains Mono',monospace;font-size:.75rem;margin-bottom:.3rem;}
.hop-status{font-family:'JetBrains Mono',monospace;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:.4rem;}
.hop-status.pass{color:var(--green);}
.hop-status.fail{color:var(--red);}
.hop-failures{font-size:.72rem;color:var(--muted);line-height:1.5;}
.hop-connector{width:1px;height:1.5rem;background:var(--rule);margin:0 0 0 2.75rem;}
.chain-overall{margin-top:1.75rem;padding:1.25rem 1.5rem;background:var(--surface);border-top:2px solid var(--ink);font-family:'JetBrains Mono',monospace;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;}
.chain-overall.pass{color:var(--green);}
.chain-overall.fail{color:var(--red);}

/* ════════════════════════════════════════════════════════════════════
   TAB 4 — Licence Compatibility
   ════════════════════════════════════════════════════════════════════ */
.dalicc-status-bar{display:flex;align-items:center;gap:.75rem;padding:.85rem 1.1rem;background:var(--surface);border-left:3px solid var(--rule);margin-bottom:1.5rem;font-family:'JetBrains Mono',monospace;font-size:.72rem;}
.dalicc-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;}
.dalicc-dot.online{background:var(--green);}
.compat-card{background:var(--surface);margin-bottom:1px;padding:1.5rem;opacity:0;animation:fadeUp .3s ease forwards;border-left:3px solid var(--rule);}
.compat-card.yes{border-left-color:var(--green);}
.compat-card.no{border-left-color:var(--red);}
.compat-header{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1rem;}
.compat-dist{font-family:'JetBrains Mono',monospace;font-size:.78rem;font-weight:700;}
.compat-rp{font-size:.73rem;color:var(--muted);font-style:italic;margin-top:.15rem;}
.compat-badge{font-family:'JetBrains Mono',monospace;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;padding:.3rem .65rem;flex-shrink:0;}
.compat-badge.yes{background:var(--green-bg);color:var(--green);}
.compat-badge.no{background:var(--red-bg);color:var(--red);}
.compat-row{display:flex;gap:.5rem;padding:.3rem 0;border-bottom:1px solid var(--faint);}
.compat-row:last-child{border-bottom:none;}
.compat-key{color:var(--muted);min-width:8rem;flex-shrink:0;font-size:.7rem;}
.compat-val{font-family:'JetBrains Mono',monospace;font-size:.68rem;word-break:break-all;flex:1;}
.compat-list li{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);margin-left:1rem;}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="eyebrow">Trinity College Dublin · MAI Dissertation 2026</div>
    <h1>AIMD <span>v2.0</span> Compliance Checker</h1>
    <p class="subtitle">AI Model Distribution ODRL Profile — full evaluation suite</p>
    <div class="header-controls">
      <button id="runBtn">Run All Checks</button>
      <div id="statusPill">checking GraphDB…</div>
      <div id="summary"></div>
    </div>
  </div>
</header>

<div class="tab-bar">
  <div class="tab-bar-inner">
    <button class="tab-btn active" data-tab="tab-usecases">Use Cases (15)</button>
    <button class="tab-btn" data-tab="tab-compliance">Compliance Checks</button>
    <button class="tab-btn" data-tab="tab-provenance">Provenance Chain</button>
    <button class="tab-btn" data-tab="tab-dalicc">Licence Compatibility</button>
  </div>
</div>

<main>
  <div id="errorBanner"></div>
  <div id="progress"><div class="spinner"></div><span>Running all evaluation phases…</span></div>

  <div class="tab-panel active" id="tab-usecases">
    <div id="grid"></div>
  </div>
  <div class="tab-panel" id="tab-compliance">
    <div id="compGrid" class="comp-grid"></div>
  </div>
  <div class="tab-panel" id="tab-provenance">
    <div id="chainContainer"></div>
  </div>
  <div class="tab-panel" id="tab-dalicc">
    <div id="daliccContainer"></div>
  </div>
</main>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-label="Use case detail">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕ close</button>
    <div class="modal-strip" id="modalStrip"></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// ── Per-UC scenario explanations ──────────────────────────────────────
const UC_INFO = {
  "UC-01": {
    scenario: "A research lab trains an LLM on a CC-BY licensed academic corpus and releases it as an open model with full disclosure.",
    check:    "Verifies that all four required evidence properties are declared on the distribution: trainingDatasetURL, modelWeightsURL, downstreamLicenceURI, and article50PolicyURL.",
    why:      "CC-BY 4.0 requires attribution. OSAID 1.0 mandates release of weights and training data information. EU AI Act Art. 50 requires disclosure for GPAI systems.",
  },
  "UC-02": {
    scenario: "A company fine-tunes a model on a CC-BY-NC licensed corpus and deploys it as a commercial product.",
    check:    "Detects actorType=commercial on the distribution while a parent source carries a CC-BY-NC licence, creating a direct NonCommercial conflict.",
    why:      "CC-BY-NC 4.0 §3(b) prohibits commercial adaptation. This conflict is unresolvable — the licence does not permit commercial use under any circumstances.",
  },
  "UC-03": {
    scenario: "A developer fine-tunes on a CC-BY-SA licensed corpus but releases the result under a different licence, stripping the ShareAlike obligation.",
    check:    "Checks that downstreamLicenceURI is declared when the parent distribution carries a copyleft (ShareAlike) licence. Absence indicates the obligation was not propagated.",
    why:      "CC-BY-SA 4.0 §3(b) requires derivative works to carry the same licence. Stripping this is a copyright violation, irrespective of how the fine-tuning is framed.",
  },
  "UC-04": {
    scenario: "A RAG pipeline ingests an embargoed preprint before its public release date, violating the repository's access conditions.",
    check:    "Reads the EmbargoEndDate property and compares it against today's date. If the embargo is still active, the ingestion is unlawful.",
    why:      "DSM Art. 3(1) requires lawful access to materials used for text and data mining. TCD TARA and similar repositories impose embargo periods that must be respected.",
  },
  "UC-05": {
    scenario: "A GPAI model is trained on three sources with conflicting licences (CC-BY, CC-BY-NC, CC-BY-SA) and then deployed commercially.",
    check:    "Counts parent distributions (≥3), checks actorType=commercial, and checks for the presence of a NonCommercial parent licence. All three must be true for a conflict.",
    why:      "The most restrictive licence in a multi-source provenance chain applies to the entire composite model. NC + commercial is an unresolvable conflict under DALICC dependency analysis.",
  },
  "UC-06": {
    scenario: "A competitor calls a proprietary LLM's API to generate training data and uses it to train a smaller student model (knowledge distillation).",
    check:    "Two-layer check. Layer 1: actorType=competitor against a proprietary parent licence. Layer 2: derivedModelLicenceURI absent, meaning the contractual propagation is undeclared.",
    why:      "API Terms of Service contractually prohibit distillation. The US Copyright Office (2025) treats this as a contract-law violation, not a copyright claim — but the ToS propagates contractually to derived models, analogous to GPL copyleft.",
  },
  "UC-07": {
    scenario: "A student fine-tunes an Apache 2.0 licensed base model and releases the result under the MIT licence, with full attribution.",
    check:    "Verifies that baseModelURL and modelWeightsURL are both declared, satisfying Apache 2.0's attribution requirement.",
    why:      "Apache 2.0 permits sublicensing under compatible licences (including MIT) but requires attribution. MIT is a permissive and fully compatible downstream licence.",
  },
  "UC-08": {
    scenario: "An AGPL-licensed fine-tuned model is deployed as a public network API without providing users access to the model source.",
    check:    "Detects deploymentContext=network AND modelWeightsURL absent simultaneously — the exact condition triggering AGPLv3 §13.",
    why:      "AGPLv3 §13 extends the GPL copyleft to network use. Any user interacting with the software over a network is entitled to receive the source. Omitting modelWeightsURL violates this.",
  },
  "UC-09": {
    scenario: "A model is aligned via RLHF using human annotator feedback, but the annotators were not informed or did not consent under GDPR.",
    check:    "Checks that rlhfDataPolicy is declared (confirming RLHF was used) while userConsentStatus is absent — indicating the consent obligation was not satisfied.",
    why:      "GDPR Art. 6 requires a lawful basis for processing personal data. Art. 13/14 require that data subjects are informed. Annotator preferences and responses are personal data.",
  },
  "UC-10": {
    scenario: "A model trained on synthetic data generated by a proprietary teacher model (Phi-1 / Orca pattern) is released openly without Art. 50 disclosure.",
    check:    "Detects dataGenerationMethod=synthetic-from-proprietary-teacher AND article50PolicyURL absent. Both conditions together constitute the violation.",
    why:      "EU AI Act Art. 50 and Recitals 107–110 require disclosure when AI-generated content is used in training. Using a proprietary teacher model introduces undisclosed IP obligations into the provenance chain.",
  },
  "UC-11": {
    scenario: "A RAG system combines a retriever model and a document corpus, each with their own licence, under a W3C ODRL PolicySet.",
    check:    "Counts parent distribution licences (≥2) and verifies ragCorpusPolicy is declared, confirming the multi-asset PolicySet composition pattern is properly encoded.",
    why:      "IDS-RAM 4.0 and W3C ODRL PolicySet enable formal composition of multiple licences. This use case validates correct application of the pattern — it is expected to be compliant.",
  },
  "UC-12": {
    scenario: "A Mixture-of-Experts model is assembled from multiple expert models including one Llama-licensed expert. The merged model declares a different licence.",
    check:    "Checks that the Llama licence on the expert is propagated to the merged model. If the merged model's licence differs, the strictest-survives rule has been violated.",
    why:      "Meta Llama Community Licence §2 requires that any derivative — including merged models — carries the Llama licence. MoE merging does not dissolve licence obligations.",
  },
  "UC-13": {
    scenario: "A planner LLM calls an executor LLM at inference time via an API call — a runtime composition with no training relationship between the two models.",
    check:    "Checks that InferenceChainLicence is declared AND that no training evidence (trainingDatasetURL, baseModelURL) exists. This is a true-negative test — the system should not flag inference-time use as a training obligation.",
    why:      "This tests the system's ability to distinguish inference-time composition from training-time derivation. Flagging this as a violation would be a false positive.",
  },
  "UC-14": {
    scenario: "A GPAI API is four provenance hops away from a CC-BY licensed corpus. EU AI Act Art. 50 declarations must exist at every hop in the chain.",
    check:    "Counts how many nodes in the 4-hop chain (corpus → base LLM → fine-tune → GPAI API) carry an article50PolicyURL. Requires ≥3 of 4 hops to be declared.",
    why:      "EU AI Act Art. 50 imposes disclosure obligations that must be maintained across the entire provenance chain, not just the terminal model. Each derivation step must carry the declaration forward.",
  },
  "UC-15": {
    scenario: "A consumer AI product is the result of 5 derivation hops, each introducing its own licence conflict: distillation prohibition, Art. 50 gap, and MoE inheritance failure.",
    check:    "Three independent ASK queries: (1) distillation prohibition via competitor actor, (2) synthetic data without Art. 50 declaration, (3) MoE merge without Llama licence propagation.",
    why:      "Real GPAI supply chains involve overlapping obligations from multiple sources. This tests detection of cascading, unresolvable conflicts across a complex provenance graph.",
  },
};

// ── Tabs ──────────────────────────────────────────────────────────────
document.querySelectorAll(".tab-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
    btn.classList.add("active");
    $(btn.dataset.tab).classList.add("active");
  });
});

// ── Accordions ────────────────────────────────────────────────────────
function bindAccordions(parent) {
  parent.querySelectorAll(".acc-trigger").forEach(t => {
    t.addEventListener("click", () => {
      const exp = t.getAttribute("aria-expanded") === "true";
      t.setAttribute("aria-expanded", !exp);
    });
  });
}

// ── Modal ─────────────────────────────────────────────────────────────
const overlay = $("modalOverlay");

function openModal(uc) {
  const info  = UC_INFO[uc.id] || {};
  const cls   = uc.compliant ? "compliant" : "violation";
  $("modalStrip").className = `modal-strip ${cls}`;
  $("modalBody").innerHTML  = `
    <div class="modal-meta">
      <div class="modal-uc-num">${esc(uc.id.replace("UC-",""))}</div>
      <div class="modal-meta-right">
        <div class="modal-badge ${cls}">${esc(uc.verdict)}</div>
        <div class="modal-title">${esc(uc.title)}</div>
        <div class="modal-chain">${esc(uc.chain)}</div>
      </div>
    </div>

    ${info.scenario ? `<div class="modal-section">
      <div class="modal-section-label">Scenario</div>
      <div class="modal-section-body">${esc(info.scenario)}</div>
    </div>` : ""}

    ${info.check ? `<div class="modal-section">
      <div class="modal-section-label">What the check does</div>
      <div class="modal-section-body">${esc(info.check)}</div>
    </div>` : ""}

    <div class="modal-section">
      <div class="modal-section-label">Finding</div>
      <div class="modal-finding ${cls}">${esc(uc.detail)}</div>
    </div>

    ${info.why ? `<div class="modal-section">
      <div class="modal-section-label">Why it matters</div>
      <div class="modal-section-body">${esc(info.why)}</div>
    </div>` : ""}

    ${uc.legalBasis ? `<div class="modal-section">
      <div class="modal-section-label">Legal basis</div>
      <div class="modal-legal">${esc(uc.legalBasis)}</div>
    </div>` : ""}
  `;
  overlay.classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  overlay.classList.remove("open");
  document.body.style.overflow = "";
}

$("modalClose").addEventListener("click", closeModal);
overlay.addEventListener("click", e => { if (e.target === overlay) closeModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

// ── Status ────────────────────────────────────────────────────────────
async function checkStatus() {
  try {
    const r = await fetch("/api/status");
    const d = await r.json();
    if (!d.graphdb) {
      $("statusPill").textContent = "GraphDB offline"; $("runBtn").disabled = true;
    } else if (!d.dataLoaded) {
      $("statusPill").textContent = "GraphDB online · no data"; $("runBtn").disabled = false;
    } else {
      $("statusPill").textContent = "GraphDB online · data loaded"; $("runBtn").disabled = false;
    }
  } catch {
    $("statusPill").textContent = "Server not reachable"; $("runBtn").disabled = true;
  }
}

function esc(s) {
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// ══════════════════════════════════════════════════════════════════════
// RENDER: Tab 1 — Use Cases
// ══════════════════════════════════════════════════════════════════════
function renderEmpty() {
  const grid = $("grid"); grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 15; i++) {
    const ph = document.createElement("div"); ph.className = "ph-card";
    ph.innerHTML = `<div class="ph-line w20" style="height:28px;margin-bottom:1rem"></div>
      <div class="ph-line w60"></div><div class="ph-line w40"></div>
      <div style="height:.8rem"></div>
      <div class="ph-line w80"></div><div class="ph-line w60"></div>`;
    frag.appendChild(ph);
  }
  grid.appendChild(frag);
}

let ucData = [];

function renderUseCases(results) {
  ucData = results;
  const grid = $("grid"); grid.innerHTML = "";
  const frag = document.createDocumentFragment();
  results.forEach((r, i) => {
    const card = document.createElement("div");
    card.className = "card " + (r.compliant ? "compliant" : "violation");
    card.style.animationDelay = `${i * 35}ms`;
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.innerHTML = `
      <div class="uc-num">${esc(r.id.replace("UC-",""))}</div>
      <div class="card-title">${esc(r.title)}</div>
      <div class="card-chain">${esc(r.chain)}</div>
      <div class="card-verdict">${esc(r.verdict)}</div>
      <div class="card-detail">${esc(r.detail)}</div>
      ${r.legalBasis ? `<div class="card-legal">${esc(r.legalBasis)}</div>` : ""}
      <div class="card-click-hint">click for detail →</div>`;
    card.addEventListener("click", () => openModal(r));
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") openModal(r); });
    frag.appendChild(card);
  });
  grid.appendChild(frag);
}

// ══════════════════════════════════════════════════════════════════════
// RENDER: Tab 2 — Compliance Checks
// ══════════════════════════════════════════════════════════════════════
function renderObligations(obs) {
  if (!obs || obs.length === 0) return '<p class="no-data">No obligations loaded from graph.</p>';
  return obs.map(ob => {
    const icCls = ob.present ? "pass" : (ob.severity === "mandatory" ? "fail" : "warn");
    const ic    = ob.present ? "✓"   : (ob.severity === "mandatory" ? "✗"   : "◎");
    return `<div class="ob-row">
      <div class="ob-icon ${icCls}">${ic}</div>
      <div class="ob-content">
        <div class="ob-label">${esc(ob.label)}</div>
        ${ob.checkDesc  ? `<div class="ob-desc">${esc(ob.checkDesc)}</div>` : ""}
        ${ob.legalBasis ? `<div class="ob-legal">Legal basis: ${esc(ob.legalBasis)}</div>` : ""}
        ${!ob.present   ? `<div class="ob-value">→ ${esc(ob.value)}</div>` : ""}
      </div>
    </div>`;
  }).join("");
}

function renderSubChecks(items) {
  if (!items || items.length === 0) return "";
  return items.map(s => {
    const icCls = s.present ? "pass" : (s.severity === "mandatory" ? "fail" : "warn");
    const ic    = s.present ? "✓"   : (s.severity === "mandatory" ? "✗"   : "◎");
    return `<div class="sub-row">
      <div class="sub-icon ${icCls}">${ic}</div>
      <div class="sub-label">${esc(s.label)}</div>
      <div class="sub-value">${esc(s.present ? s.value : "(not declared)")}</div>
    </div>`;
  }).join("");
}

function renderCrossRepo(xr) {
  if (!xr) return '<p class="no-data" style="font-size:.72rem">No source ResearchProduct link found — cross-repo check skipped.</p>';
  const resCls = xr.verifiable ? "pass" : "fail";
  const resTxt = xr.verifiable ? "✓ Licence chain verifiable" : "⚠ One or both sides undeclared";
  return `
    <div class="xr-row"><div class="xr-key">Source product</div><div class="xr-val">${esc(xr.sourceRP)}</div></div>
    <div class="xr-row"><div class="xr-key">Source licence</div><div class="xr-val">${esc(xr.sourceLicence)}</div></div>
    <div class="xr-row"><div class="xr-key">Dist licence</div><div class="xr-val">${esc(xr.distLicence)}</div></div>
    <div class="xr-result ${resCls}">${resTxt}</div>`;
}

function renderV2(v2) {
  if (!v2 || v2.noData) return '<p class="no-data" style="font-size:.72rem">No aimd2: obligation terms found — load AIMD_extended_v2.ttl first.</p>';
  const sum = `${v2.mandatoryFailures} mandatory failures · ${v2.recommendedGaps} recommended gaps`;
  const rows = v2.obligations.map(ob => {
    const icCls = ob.present ? "pass" : (ob.severity === "mandatory" ? "fail" : "warn");
    const ic    = ob.present ? "✓"   : (ob.severity === "mandatory" ? "✗"   : "◎");
    return `<div class="ob-row">
      <div class="ob-icon ${icCls}">${ic}</div>
      <div class="ob-content">
        <div class="ob-label">${esc(ob.obligation)}</div>
        ${ob.checkDesc  ? `<div class="ob-desc">${esc(ob.checkDesc)}</div>` : ""}
        ${ob.legalBasis ? `<div class="ob-legal">Legal basis: ${esc(ob.legalBasis)}</div>` : ""}
        ${!ob.present   ? `<div class="ob-value">→ ${esc(ob.value)}</div>` : ""}
      </div>
    </div>`;
  }).join("");
  return `<div class="comp-summary" style="margin-bottom:.75rem">${esc(sum)}</div>${rows}`;
}

function renderCompliancePanel(c) {
  if (c.noData) return `<div class="comp-panel">
    <div class="comp-dist-id">dcat:${esc(c.distributionID)}</div>
    <p class="no-data">No graph-defined obligations found. Load AIMD_extended.ttl into GraphDB.</p>
  </div>`;
  const overallCls = c.allCompliant ? "pass" : "fail";
  const overallTxt = c.allCompliant ? "✓ FULLY COMPLIANT" : "✗ NON-COMPLIANT";
  const sum = `${c.mandatoryFails} mandatory failure${c.mandatoryFails!==1?"s":""} · ${c.recommendedFails} recommended gap${c.recommendedFails!==1?"s":""}`;
  const coSection = c.co2
    ? `<div class="acc-section"><button class="acc-trigger" aria-expanded="false"><span class="acc-label">CO₂ / Energy Disclosure (9 sub-attributes)</span><span class="acc-arrow">▼</span></button><div class="acc-body">${renderSubChecks(c.co2)}</div></div>`
    : `<div class="acc-section"><button class="acc-trigger" aria-expanded="false"><span class="acc-label">CO₂ / Energy Disclosure</span><span class="acc-arrow">▼</span></button><div class="acc-body"><p class="no-data" style="font-size:.72rem">CO₂ Disclosure object missing.</p></div></div>`;
  const cpSection = c.copyright
    ? `<div class="acc-section"><button class="acc-trigger" aria-expanded="false"><span class="acc-label">Copyright / IP Policy (6 sub-attributes)</span><span class="acc-arrow">▼</span></button><div class="acc-body">${renderSubChecks(c.copyright)}</div></div>`
    : `<div class="acc-section"><button class="acc-trigger" aria-expanded="false"><span class="acc-label">Copyright / IP Policy</span><span class="acc-arrow">▼</span></button><div class="acc-body"><p class="no-data" style="font-size:.72rem">Copyright Policy object missing.</p></div></div>`;
  return `<div class="comp-panel">
    <div style="margin-bottom:1.5rem">
      <div class="comp-dist-id">dcat:${esc(c.distributionID)}</div>
      <div class="comp-overall ${overallCls}">${overallTxt}</div>
      <div class="comp-summary">${esc(sum)}</div>
    </div>
    <div class="acc-section"><button class="acc-trigger" aria-expanded="true"><span class="acc-label">Graph-Defined Obligations (${c.obligations.length})</span><span class="acc-arrow">▼</span></button><div class="acc-body">${renderObligations(c.obligations)}</div></div>
    ${coSection}
    ${cpSection}
    <div class="acc-section"><button class="acc-trigger" aria-expanded="false"><span class="acc-label">V2 Obligations — aimd2: (${c.v2&&!c.v2.noData?c.v2.obligations.length:0})</span><span class="acc-arrow">▼</span></button><div class="acc-body">${renderV2(c.v2)}</div></div>
    <div class="acc-section"><button class="acc-trigger" aria-expanded="false"><span class="acc-label">Cross-Repository Licence Check</span><span class="acc-arrow">▼</span></button><div class="acc-body">${renderCrossRepo(c.crossRepo)}</div></div>
  </div>`;
}

function renderCompliance(checks) {
  const grid = $("compGrid");
  grid.innerHTML = checks.map(renderCompliancePanel).join("");
  bindAccordions(grid);
}

// ══════════════════════════════════════════════════════════════════════
// RENDER: Tab 3 — Provenance Chain
// ══════════════════════════════════════════════════════════════════════
function renderProvenance(prov) {
  const c = $("chainContainer");
  if (!prov || prov.chain.length === 0) {
    c.innerHTML = '<p class="no-data">No provenance chain data — run checks first.</p>'; return;
  }
  const overallCls = prov.overallCompliant ? "pass" : "fail";
  const overallTxt = prov.overallCompliant ? "✓ Chain overall: FULLY COMPLIANT" : "✗ Chain overall: NON-COMPLIANT at one or more hops";
  const hops = prov.chain.map((h, i) => {
    const cls   = h.compliant ? "hop-pass" : "hop-fail";
    const stCls = h.compliant ? "pass" : "fail";
    const stTxt = h.compliant ? "COMPLIANT" : "NON-COMPLIANT";
    const fails = h.failures.length > 0 ? `<div class="hop-failures">${h.failures.map(f=>`<span>· ${esc(f)}</span>`).join("")}</div>` : "";
    const conn  = i < prov.chain.length - 1 ? `<div class="hop-connector"></div>` : "";
    return `<div class="hop-item ${cls}" style="animation-delay:${i*80}ms">
      <div class="hop-num">${h.hopNumber}</div>
      <div class="hop-body">
        <div class="hop-dist-id">${esc(h.distID)}</div>
        <div class="hop-status ${stCls}">${stTxt}</div>
        ${fails}
      </div>
    </div>${conn}`;
  }).join("");
  c.innerHTML = `
    <div class="chain-title">N-Hop Provenance Chain</div>
    <div class="chain-start">${esc(prov.startURI)}</div>
    <div>${hops}</div>
    <div class="chain-overall ${overallCls}">${overallTxt}</div>`;
}

// ══════════════════════════════════════════════════════════════════════
// RENDER: Tab 4 — Licence Compatibility
// ══════════════════════════════════════════════════════════════════════
function renderDalicc(d) {
  const c = $("daliccContainer");
  if (!d) { c.innerHTML = '<p class="no-data">No data — run checks first.</p>'; return; }
  const dotCls  = d.available ? "online" : "";
  const statusT = d.available ? "DALICC online · semantic compatibility check" : "DALICC offline · URI matching fallback";
  const bar     = `<div class="dalicc-status-bar"><div class="dalicc-dot ${dotCls}"></div><span>${esc(statusT)}</span></div>`;
  if (d.pairs.length === 0) { c.innerHTML = bar + '<p class="no-data">No licence pairs found — run npm start first.</p>'; return; }
  const cards = d.pairs.map((p, i) => {
    const cls  = p.compatible ? "yes" : "no";
    const bagT = p.compatible ? "COMPATIBLE" : "CONFLICT";
    const conf = p.conflicts.length > 0 ? `<div class="compat-row"><div class="compat-key">Conflicts</div><div class="compat-val"><ul class="compat-list">${p.conflicts.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>` : "";
    const hin  = p.hints.length > 0    ? `<div class="compat-row"><div class="compat-key">Hints</div><div class="compat-val"><ul class="compat-list">${p.hints.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>` : "";
    return `<div class="compat-card ${cls}" style="animation-delay:${i*80}ms">
      <div class="compat-header">
        <div><div class="compat-dist">${esc(p.distribution)}</div><div class="compat-rp">← ${esc(p.sourceRP)}</div></div>
        <div class="compat-badge ${cls}">${bagT}</div>
      </div>
      <div>
        <div class="compat-row"><div class="compat-key">Method</div><div class="compat-val">${esc(p.method)}</div></div>
        <div class="compat-row"><div class="compat-key">Source licence</div><div class="compat-val">${esc(p.sourceLicence)}</div></div>
        <div class="compat-row"><div class="compat-key">Dist licence</div><div class="compat-val">${esc(p.distLicence)}</div></div>
        ${conf}${hin}
      </div>
    </div>`;
  }).join("");
  c.innerHTML = bar + cards;
}

// ── Run ───────────────────────────────────────────────────────────────
$("runBtn").addEventListener("click", async () => {
  $("runBtn").disabled = true;
  $("errorBanner").classList.remove("visible");
  $("progress").classList.add("visible");
  $("summary").textContent = "";
  try {
    const r = await fetch("/api/run");
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    $("progress").classList.remove("visible");
    renderUseCases(data.useCases);
    renderCompliance(data.complianceChecks);
    renderProvenance(data.provenance);
    renderDalicc(data.dalicc);
    const v = data.useCases.filter(x=>!x.compliant).length;
    const p = data.useCases.filter(x=> x.compliant).length;
    $("summary").textContent = `${p} compliant · ${v} violations · ${(data.durationMs/1000).toFixed(1)}s`;
  } catch (err) {
    $("progress").classList.remove("visible");
    $("errorBanner").textContent = "Error: " + err.message + " — Is GraphDB running and data loaded?";
    $("errorBanner").classList.add("visible");
  } finally {
    $("runBtn").disabled = false;
    checkStatus();
  }
});

renderEmpty();
checkStatus();
</script>
